controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      
    easyrobot_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      
#Controller for the easybot must have the same name as in the moveit_controllers.yaml file
easyrobot_controller:
  ros__parameters:
    type: "joint_trajectory_controller/JointTrajectoryController"
    joints:
      - joint1
      - joint2
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      joint1:
        p: 500.0
        i: 10.0
        d: 100.0
        i_clamp: 20.0
        antiwindup: true
      joint2:
        p: 150.0
        i: 5.0
        d: 30.0
        i_clamp: 10.0
        antiwindup: true
    allow_nonzero_velocity_at_trajectory_end: true
